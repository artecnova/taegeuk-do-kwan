<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración | Taegeuk Do Kwan</title>

    <link rel="icon" type="image/png" href="Img/logo.png">

    <link rel="stylesheet" href="style.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="admin-login">

        <div class="admin-login-box">

            <img
                src="Img/logo.png"
                alt="Club Taegeuk Do Kwan"
                class="admin-logo"
            >

            <h1>
                Administración
            </h1>

            <p>
                Club Taegeuk Do Kwan
            </p>


            <form id="login-form">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Correo electrónico"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >


                <button type="submit">
                    Iniciar sesión
                </button>

                <p
                    id="login-error"
                    class="login-error"
                ></p>

            </form>


            <a
                href="index.html"
                class="volver-inicio"
            >
                ← Volver al sitio
            </a>

        </div>

    </main>


    <script type="module" src="admin.js"></script>

</body>

</html>
